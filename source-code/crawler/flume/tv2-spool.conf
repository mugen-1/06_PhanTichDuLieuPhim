# thi doc tung dong va ghi len HDFS /user/nhom06/movies/raw/flume/<ngay>/
# Dung cho 2 file JSON lines cua OMDb va Wikipedia.
tv2.sources  = src1
tv2.channels = ch1
tv2.sinks    = hdfs1

tv2.sources.src1.type     = spooldir
tv2.sources.src1.spoolDir = /home/nhom06/flume_spool
